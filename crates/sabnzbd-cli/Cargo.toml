[package]
name = "sabnzbd-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustnzbd"
path = "src/main.rs"

[dependencies]
sabnzbd-core = { path = "../sabnzbd-core" }
sabnzbd-api = { path = "../sabnzbd-api" }
sabnzbd-nzb = { path = "../sabnzbd-nzb" }
sabnzbd-nntp = { path = "../sabnzbd-nntp" }
sabnzbd-decode = { path = "../sabnzbd-decode" }
sabnzbd-postproc = { path = "../sabnzbd-postproc" }
sabnzbd-services = { path = "../sabnzbd-services" }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tray-icon = { version = "0.26", optional = true }
tao = { version = "0.37", optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:tao"]

[dev-dependencies]
tempfile = { workspace = true }
crc32fast = { workspace = true }
tower = { workspace = true }
serde_json = { workspace = true }
